<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달빛 라이브러리(GL) | 달빛출판사</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-wrap">
  <!-- 게임 컨테이너: 사이드바(280px) 제외한 영역에서 전체 높이 사용 -->
  <div id="DL-WRAPPER" style="width:100%; height:calc(100dvh - 20px); min-height:520px; max-height:920px; background:transparent; font-family:'Noto Sans KR',sans-serif; user-select:none; overflow:hidden; display:flex; justify-content:center; padding:0;">
    <style>
        #DL-WRAPPER * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        #DL-WRAPPER .game-inner {
            width: 100%; max-width: 500px; height: 100%; background: linear-gradient(135deg, #04050e 0%, #0b0d20 100%);
            border-radius: 0; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 20px 70px rgba(0,0,0,0.8); overflow: hidden;
            color: #f0e6c8; border: none;
        }
        @media (min-width: 500px) {
            #DL-WRAPPER { padding: 10px; height: 90vh; max-height: 900px; }
            #DL-WRAPPER .game-inner { border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        }
        @keyframes dl-twink { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        .dl-star { position: absolute; background: #fff; border-radius: 50%; pointer-events: none; z-index: 1; }
        .serif { font-family: 'Noto Serif KR', serif; }
        .screen { display: none; flex: 1; flex-direction: column; position: relative; z-index: 2; height: 100%; overflow: hidden; }
        .screen.active { display: flex; }
        .st-badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; background: rgba(255,255,255,0.15); white-space: nowrap; }
        .st-1 { color: #4a8fe8; border: 1px solid #4a8fe855; background: rgba(74, 143, 232, 0.15); }
        .st-2 { color: #c9952a; border: 1px solid #c9952a55; background: rgba(201, 149, 42, 0.15); }
        .st-3 { color: #e06090; border: 1px solid #e0609055; background: rgba(224, 96, 144, 0.15); }
        .vib-glow-pnl { border: 2px solid #c9952a !important; box-shadow: 0 0 12px rgba(201,149,42,0.4); background: linear-gradient(135deg, #28180a, #3a2508) !important; }
        .header { padding: 6px 12px; background: rgba(14, 16, 37, 0.95); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d45; flex-shrink: 0; }
        .panel { padding: 6px 12px; background: rgba(255,255,255,0.04); display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #2a2d45; flex-shrink: 0; }
        .timer-cir { width: 32px; height: 32px; border: 3px solid #c9952a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #c9952a; font-size: 13px; flex-shrink: 0; transition: border-color 0.3s; background: rgba(0,0,0,0.3); }
        .timer-cir.danger { border-color: #f87171; color: #f87171; animation: dl-wa 0.7s ease-in-out infinite; }
        @keyframes dl-wa { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 10px; flex: 1; overflow-y: auto; align-content: start; }
        @media (min-width: 450px) { .grid { gap: 8px; padding: 10px 14px; } }
        .book-item { cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; position: relative; }
        .img-box { width: 100%; aspect-ratio: 1/1.45; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: #000; margin-bottom: 2px; position: relative; }
        .book-item:hover .img-box { border-color: #252d60; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .book-item.sel .img-box { border-color: #c9952a; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(201,149,42,0.5); }
        .book-item.dm .img-box { opacity: 0.42; }
        .book-item.vr .img-box { border-color: #4ade80; box-shadow: 0 0 12px rgba(74,222,128,0.4); }
        .book-item.wr .img-box { border-color: #f87171; box-shadow: 0 0 12px rgba(248,113,113,0.4); }
        .bvi { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(74,222,128,0.15); font-size: 20px; z-index: 5; }
        .book-item.vr .bvi { display: flex; }
        .book-item img { width: 100%; height: 100%; object-fit: cover; }
        .book-t { font-size: 8.5px; line-height: 1.2; color: #fff; text-align: center; word-break: keep-all; height: 21px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-shadow: 0 1px 2px rgba(0,0,0,0.8); letter-spacing: -0.5px; }
        .book-item.sel .book-t { color: #ffcc00; font-weight: 900; }
        .footer { padding: 6px 12px; background: rgba(14, 16, 37, 0.98); display: flex; align-items: center; gap: 8px; border-top: 1px solid #2a2d45; flex-shrink: 0; height: 46px; }
        .btn-ui { background: linear-gradient(135deg, #c9952a, #a67720); color: #fff; border: none; padding: 0 14px; height: 34px; border-radius: 6px; font-weight: 900; cursor: pointer; font-size: 12px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-family: 'Noto Serif KR', serif; letter-spacing: 0.05em; }
        .btn-ui:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(201,149,42,0.5); opacity: 0.9; }
        .btn-ui:disabled { opacity: 0.35; cursor: not-allowed; background: #555; color: #ccc; box-shadow: none; }
        .btn-center-wrap { width: 100%; display: flex; justify-content: center; padding: 10px 0; flex-shrink: 0; }
        .btn-main { height: 42px; padding: 0 40px; font-size: 14px; border-radius: 8px; width: 100%; max-width: 260px; }
        .res-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-bottom: 10px; width: 100%; flex-shrink: 0; }
        .h-line { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .kw-tag { display: inline-block; padding: 6px 12px; background: rgba(201,149,42,0.1); border: 1px solid #c9952a55; border-radius: 6px; font-size: 11px; color: #fff; margin: 3px; font-weight: bold; }
        .kw-tag .count { color: #f0e6c8; font-size: 10px; font-weight: normal; margin-left: 4px; }
        .over-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(4px); }
        .over-layer.active { display: flex; }
        .fb-sub { color: #f0e6c8; font-size: 12px; margin-top: 8px; font-weight: bold; }
        .fluid-title { font-size: clamp(28px, 8vw, 46px); font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-shadow: 0 0 30px rgba(201,149,42,0.4); text-align: center; }
        .fluid-subtitle { font-size: clamp(12px, 3.5vw, 15px); line-height: 1.4; text-align: center; color: #fff; font-weight: bold; margin-bottom: 20px; }
        .res-title { font-size: clamp(22px, 6vw, 34px); font-weight: 900; text-align: center; color: #fff; margin-bottom: 10px; }
        .res-score-text { font-size: clamp(30px, 9vw, 46px); color: #ffcc00; font-weight: 900; text-shadow: 0 0 10px rgba(255,204,0,0.3); margin-bottom: 4px; }
        .link-btn { display: inline-block; padding: 6px 14px; background: linear-gradient(135deg, #c9952a, #a67720); color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 11px; margin: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: 0.2s; }
        .link-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(201,149,42,0.6); }
    </style>

    <div class="game-inner" id="DL-VIEWPORT">
        <div id="dl-stars-container"></div>
        <div id="dl-v-intro" class="screen active" style="justify-content: center; padding: 0 20px;">
            <p style="text-align:center; color:#8090c0; font-size:9px; letter-spacing:0.2em; margin-bottom:6px; font-weight:bold;">DALBIC PUBLISHING HOUSE</p>
            <h1 class="serif fluid-title">달빛<br>라이브러리</h1>
            <div style="width: 40px; height: 3px; background: linear-gradient(90deg, transparent, #c9952a, transparent); margin: 0 auto 12px;"></div>
            <p class="fluid-subtitle">달빛출판사 편집장으로 취임하신 것을 축하합니다.<br>GL소설을 찾아 온 독자의 취향에 맞는 책을 건네주세요.</p>
            <div class="btn-center-wrap">
                <button class="btn-ui btn-main" onclick="DALBIC.start()">영업 시작 🌙</button>
            </div>
        </div>
        <div id="dl-v-game" class="screen">
            <div class="header">
                <span id="dl-stg" class="st-badge">형태</span>
                <span style="font-size: 11px; color: #fff; font-weight: bold;">독자 <strong id="dl-pg" style="color: #ffcc00; font-size: 12px;">1/10</strong></span>
                <span id="dl-sc" style="color:#ffcc00; font-weight: 900; font-size: 13px;">✨ 0</span>
            </div>
            <div id="dl-pb-wrap" style="height: 3px; background: rgba(255,255,255,0.1); width: 100%; flex-shrink: 0;">
                <div id="dl-pb-fill" style="height: 100%; width: 0%; background: #c9952a; transition: width 0.3s;"></div>
            </div>
            <div id="dl-pnl" class="panel">
                <div style="display: flex; flex-direction: column; align-items: center; min-width: 45px;">
                    <span id="dl-vb-tag" style="display:none; background:linear-gradient(135deg,#c9952a,#a67720); color:#fff; padding:2px 4px; border-radius:4px; font-size:8px; font-weight:900; margin-bottom:4px;">✨ VIB</span>
                    <div id="dl-em" style="font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);">👤</div>
                    <div id="dl-nm" style="font-size: 9px; color:#fff; margin-top: 4px; font-weight: 900; text-align: center; line-height: 1.2;">이름</div>
                </div>
                <div style="flex:1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px;">
                    <div id="dl-dl" style="font-size: 11px; line-height:1.4; color:#ffffff; font-weight: bold; word-break: keep-all;">대사</div>
                    <div id="dl-vib-msg" style="display:none; color:#ffcc00; font-size:9px; font-weight:bold; margin-top:4px;">✨ VIB 작가님이 방문하셨습니다.</div>
                </div>
                <div id="dl-tm" class="timer-cir">40</div>
            </div>
            <div style="padding: 6px 10px 0; color: #fff; font-size: 10px; font-weight: bold; letter-spacing: -0.5px; flex-shrink: 0;">— 취향에 맞는 책을 골라주세요</div>
            <div id="dl-gd" class="grid"></div>
            <div class="footer">
                <div id="dl-msg" style="flex:1; font-size: 11px; font-weight: 900; color:#f0e6c8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">책을 선택하세요</div>
                <button id="dl-btn" class="btn-ui" disabled onclick="DALBIC.confirm()">건네기 📖</button>
            </div>
        </div>
        <div id="dl-v-res" class="screen" style="overflow-y: auto; padding: 20px 12px;">
            <p style="text-align:center; color:#8090c0; font-size:10px; font-weight:bold; letter-spacing:0.2em; margin-bottom:6px;">영업 종료</p>
            <h2 class="serif res-title">나는 오늘...</h2>
            <div style="width: 40px; height: 3px; background: linear-gradient(90deg, transparent, #c9952a, transparent); margin: 0 auto 12px;"></div>
            <div class="res-box" style="background: rgba(201,149,42,0.1); border-color: rgba(201,149,42,0.3); text-align:center;">
                <p id="res-score" class="serif res-score-text">0</p>
                <p id="res-count" style="font-size:12px; font-weight: bold; color:#fff; margin-top:4px;">0/10 큐레이션 성공</p>
            </div>
            <div class="res-box" style="background: linear-gradient(135deg, rgba(40,25,8,0.7), rgba(20,15,45,0.7)); border-color: rgba(201,149,42,0.4);">
                <h3 class="serif" style="color:#ffcc00; font-size:14px; font-weight:900; margin-bottom:10px; text-align:center;">📊 오늘의 영업 실록</h3>
                <div id="res-report-content"></div>
            </div>
            <div class="res-box" style="background: rgba(0,0,0,0.3);">
                <p style="font-size:10px; font-weight:bold; color:#8090c0; letter-spacing:0.1em; margin-bottom:8px;">상세 큐레이션 기록</p>
                <div id="res-history" style="max-height:160px; overflow-y:auto; padding-right:4px;"></div>
            </div>
            <div class="btn-center-wrap" style="flex-direction: column; gap: 8px; margin-top: 5px;">
                <button class="btn-ui btn-main" onclick="location.reload()">다시 영업하기 🌙</button>
                <p style="font-size:9px; font-weight:bold; color:#6070a0;">달빛출판사 © DALBIC PUBLISHING HOUSE</p>
            </div>
        </div>
        <div id="dl-v-fb" class="over-layer">
            <div id="fb-ico" style="font-size: 40px; margin-bottom: 10px;">✨</div>
            <h2 id="fb-h" class="serif" style="font-size: 22px; font-weight: 900; color: #fff;">완벽한 큐레이션!</h2>
            <div id="fb-s" class="fb-sub"></div>
        </div>
    </div>
  </div>
</div>

<script src="sidebar.js"></script>

                        return '<div class="h-line"><span style="color:'+(h.ok?'#4ade80':'#f87171')+';font-weight:bold;">'+(h.ok?'✓':'✗')+'</span><span style="color:#fff;min-width:45px;font-weight:bold;">'+h.c.name+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:'+(h.ok?'#ffcc00':'#a0a0a0')+';font-weight:bold;">'+(h.b?'→ 「'+h.b.t+'」':'→ 시간초과')+'</span>'+(h.c.vib?'<span style="color:#ffcc00;font-size:11px;font-weight:900;">VIB✨</span>':'')+'</div>';
                    }).join('');
                }
            };
        })();
</script>

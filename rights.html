/* ── Language Detection ── */
const countryToLang = {
  JP:'ja',
  TW:'zh-TW', HK:'zh-TW', MO:'zh-TW',
  CN:'zh-CN', SG:'zh-CN',
  TH:'th',
  KR:'ko'
};

function getLangFromBrowser() {
  const l = (navigator.language || 'en').toLowerCase();
  if (l.startsWith('ja')) return 'ja';
  if (l === 'zh-tw' || l === 'zh-hk') return 'zh-TW';
  if (l.startsWith('zh')) return 'zh-CN';
  if (l.startsWith('th')) return 'th';
  if (l.startsWith('ko')) return 'ko';
  return 'en';
}

async function detectLang() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch('https://ipapi.co/json/', {signal: ctrl.signal});
    const d = await r.json();
    return countryToLang[d.country_code] || 'en';
  } catch {
    try {
      const ctrl2 = new AbortController();
      setTimeout(() => ctrl2.abort(), 3000);
      const r2 = await fetch('https://ipwho.is/', {signal: ctrl2.signal});
      const d2 = await r2.json();
      return countryToLang[d2.country_code] || 'en';
    } catch {
      return getLangFromBrowser();
    }
  }
}

/* ── Render ── */
function getWorkGenre(work, lang) {
  if (lang === 'ja') return work.genreJa;
  if (lang === 'zh-TW') return work.genreZhTW;
  if (lang === 'zh-CN') return work.genreZhCN;
  if (lang === 'th') return work.genreTh;
  if (lang === 'ko') return work.genre.replace('GL', 'GL').split('·')[0].trim();
  return work.genre;
}

function renderPage(lang) {
  const L = LANGS[lang] || LANGS['en'];
  document.documentElement.lang = lang;

  document.getElementById('hero-label').textContent = L.heroLabel;
  document.getElementById('hero-title').textContent = L.heroTitle;
  document.getElementById('hero-desc').textContent = L.heroDesc;
  document.getElementById('about-title').textContent = L.aboutTitle;
  document.getElementById('about-text').textContent = L.aboutText;
  document.getElementById('avail-title').textContent = L.availTitle;
  document.getElementById('avail-list').innerHTML = L.availItems.map(i => `<li>${i}</li>`).join('');
  document.getElementById('genre-title').textContent = L.genreTitle;
  document.getElementById('genre-tags').innerHTML = L.genres.map(g => `<span class="genre-tag">${g}</span>`).join('');
  document.getElementById('works-title').textContent = L.worksTitle;
  document.getElementById('works-grid').innerHTML = FEATURED.map(w => `
    <div class="rights-work-card">
      <img class="rights-work-img" src="${w.poster}" alt="${w.title}" onerror="this.outerHTML='<div class=\\'rights-work-img-placeholder\\'>이미지 준비중</div>'">
      <div class="rights-work-info">
        <div class="rights-work-title">${w.title}</div>
        <div class="rights-work-genre">${getWorkGenre(w, lang)}</div>
      </div>
    </div>`).join('');
  document.getElementById('contact-title').textContent = L.contactTitle;
  document.getElementById('contact-text').innerHTML = L.contactText;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

/* ── Init ── */
let currentLang = 'en';
renderPage('en'); // 즉시 기본 렌더링

detectLang().then(lang => {
  currentLang = lang;
  renderPage(lang);
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    renderPage(currentLang);
  });
});
</script>
</body>
</html>

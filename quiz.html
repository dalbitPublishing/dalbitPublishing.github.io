        { t: "밤과 밤", p: "https://drive.google.com/thumbnail?id=1MR5FwYCVg7AhXPJ_7BdETCvxFOMgQ-e4&sz=s4000", k: "#캠퍼스물 #친구>연인 #비밀연애", l: "https://ridibooks.com/books/4614000005" },
        { t: "친구 사이에", p: "https://drive.google.com/thumbnail?id=1ZVc-bBrdphRRbqOrPzKtUzYJmLyfIbPM&sz=s4000", k: "#캠퍼스물 #친구>연인 #달달", l: "https://ridibooks.com/books/4614000009" },
        { t: "미케네의 목마", p: "https://drive.google.com/thumbnail?id=132XI_s2CtS5ZN0e5f-3ZuL0vQQ-w6you&sz=s4000", k: "#시대물 #그리스신화 #회귀물 #혐관", l: "https://ridibooks.com/books/4614000002" },
        { t: "애집(愛執)", p: "https://drive.google.com/thumbnail?id=1gMliwurZdfgSjnuev2hQFz_XRxqradEb&sz=s4000", k: "#첫사랑 #재회 #애증 #집착 #스릴러", l: "https://ridibooks.com/books/4614000001" }
    ];

    const questions = [
        { q: "오늘 당신의 연애 세포는 어떤 상태인가요?", a: [{t: "싱그러운 설렘이 필요해", k: "#학원물"}, {t: "어른들의 농밀한 연애가 보고 싶어", k: "#오피스물"}, {t: "판타지 같은 특별한 만남", k: "#판타지물"}, {t: "가슴 저린 서사가 좋아", k: "#애잔"}] },
        { q: "두 사람의 관계, 어떤 시작이 더 끌리나요?", a: [{t: "십여 년 지기의 아슬아슬한 변화", k: "#친구>연인 #소꿉친구"}, {t: "지독하게 얽힌 운명적 만남", k: "#재회 #첫사랑"}, {t: "처음 본 순간 빠져드는 직진", k: "#직진"}, {t: "비즈니스로 시작된 사이", k: "#계약관계"}] },
        { q: "가장 선호하는 배경은 어디인가요?", a: [{t: "평범하고 공감 가는 현실 현대물", k: "#현대물"}, {t: "웅장한 서사가 있는 서양/동양풍", k: "#시대물"}, {t: "미래나 이능력이 있는 특수 배경", k: "#SF #센티넬버스"}, {t: "치열하고 화려한 연예계", k: "#연예계"}] },
        { q: "주인공의 성격 중 하나를 고른다면?", a: [{t: "지켜주고 싶은 상처 많은 사람", k: "#상처녀 #상처수"}, {t: "나를 리드해 줄 능력 있는 사람", k: "#능력녀 #걸크러시"}, {t: "애교 많고 귀여운 연하", k: "#연하공"}, {t: "다정하고 헌신적인 연상", k: "#연상공"}] },
        { q: "고백의 스타일, 당신의 취향은?", a: [{t: "진한 진심을 담은 긴 짝사랑", k: "#짝사랑"}, {t: "앞뒤 안 재고 달려드는 불도저", k: "#직진녀"}, {t: "서서히 스며드는 일상 속 고백", k: "#일상"}, {t: "거부할 수 없는 집착 섞인 고백", k: "#집착"}] },
        { q: "사랑의 '맛'을 고른다면?", a: [{t: "입안 가득 달콤한 설탕맛", k: "#달달"}, {t: "여운이 길게 남는 단짠 삽질", k: "#오해"}, {t: "매콤하고 아찔한 고수위 맛", k: "#고수위"}, {t: "쓰디쓴 눈물의 피폐한 맛", k: "#피폐"}] },
        { q: "작품의 분위기는 어떠면 좋을까요?", a: [{t: "햇살처럼 청량하고 밝은 느낌", k: "#로맨틱코미디"}, {t: "달빛처럼 고요하고 깊은 감성", k: "#감성 #애잔"}, {t: "긴장감 넘치는 느와르 분위기", k: "#느와르 #스릴러"}, {t: "따뜻하게 위로해 주는 힐링", k: "#힐링물"}] },
        { q: "갈등의 농도는 어느 정도가 적당할까요?", a: [{t: "스트레스 없는 시원한 사이다", k: "#달달물"}, {t: "사건이 얽힌 치명적인 긴장감", k: "#액션 #복수"}, {t: "애증이 뒤섞인 관계의 파동", k: "#애증"}, {t: "조용히 흘러가는 잔잔한 일상", k: "#일상물"}] },
        { q: "과거의 인연이 다시 닿는 걸 좋아하시나요?", a: [{t: "다시 만난 첫사랑 재회물", k: "#재회 #첫사랑"}, {t: "새로운 인연과의 시작", k: "#운명"}, {t: "앙숙에서 연인이 되는 과정", k: "#혐관"}, {t: "신분 차이를 극복하는 서사", k: "#신분차이"}] },
        { q: "바라는 엔딩의 모습은?", a: [{t: "무조건 꽉 닫힌 해피엔딩", k: "#해피엔딩"}, {t: "현실적인 고민이 담긴 성장", k: "#성장물"}, {t: "서로가 서로의 구원이 되는 끝", k: "#쌍방구원"}, {t: "아련하게 가슴에 남는 결말", k: "#애잔"}] }
    ];

    let currentIdx = 0; let userPicks = [];
    const quizContents = document.getElementById('quiz-contents');
    const resultArea = document.getElementById('result-area');
    const quizCard = document.getElementById('quiz-card');
    const progressFill = document.getElementById('progress-fill');

    window.nextStep = function(key) {
        userPicks.push(key);
        document.getElementById('q-' + currentIdx).classList.remove('active');
        currentIdx++;
        progressFill.style.width = (currentIdx / questions.length * 100) + '%';
        if (currentIdx < questions.length) {
            document.getElementById('q-' + currentIdx).classList.add('active');
        } else {
            showResults();
        }
    }

    function renderQuiz() {
        quizContents.innerHTML = '';
        questions.forEach((q, i) => {
            const qBox = document.createElement('div');
            qBox.className = 'q-box'; qBox.id = 'q-' + i;
            if(i === 0) qBox.classList.add('active');
            let btns = q.a.map(ans => `<button class="ans-btn" onclick="nextStep('${ans.k}')">${ans.t}</button>`).join('');
            qBox.innerHTML = `<div class="q-num">QUESTION ${i+1}</div><div class="q-text">${q.q}</div>${btns}`;
            quizContents.appendChild(qBox);
        });
    }

    function showResults() {
        quizCard.style.display = 'none';
        document.querySelector('.matching-title-wrap').style.display = 'none';
        resultArea.style.display = 'block';

        const scoredWorks = worksData.map(work => {
            let score = 0; let matchedTags = [];
            userPicks.forEach(pick => {
                pick.split(' ').forEach(pk => {
                    if (work.k.includes(pk)) { score++; if (!matchedTags.includes(pk)) matchedTags.push(pk); }
                });
            });
            return { ...work, score, matchedTags };
        });

        const maxScore = Math.max(...scoredWorks.map(w => w.score));
        const recommended = scoredWorks.filter(w => w.score > 0 && w.score >= maxScore - 1)
                                      .sort((a, b) => b.score - a.score);

        if (recommended.length > 0) {
            const topTags = recommended[0].matchedTags.slice(0, 3).join(' ');
            document.getElementById('analysis-text').innerText = `당신은 ${topTags} 취향이시군요!`;
        }

        document.getElementById('result-grid').innerHTML = recommended.map(res => `
            <a href="${res.l}" target="_blank" class="res-card">
                <img src="${res.p}" class="res-img" onerror="this.src='https://via.placeholder.com/200x280?text=Dalbit'">
                <div class="res-info">
                    <div class="res-name">${res.t}</div>
                    <div class="res-tags">${res.k}</div>
                </div>
            </a>`).join('');
    }
    renderQuiz();
});
</script>
</body>
</html>
